services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  server:
    image: eduflow-course-admin-server-nest
    build:
      context: ./server-nest
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./server-nest/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVE_STATIC=false
      - DATA_ROOT=/app/data
      # 后端容器访问宿主机 MySQL 时，需要使用 Docker Desktop 提供的 host.docker.internal。
      - MYSQL_HOST=host.docker.internal
      - TYPEORM_MIGRATIONS_RUN=${TYPEORM_MIGRATIONS_RUN:-true}
    volumes:
      - ./server-nest/data:/app/data
    restart: unless-stopped
    healthcheck:
      # /api/auth/me returns 401 without a token after NestJS is ready.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/auth/me', r => process.exit(r.statusCode === 401 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
