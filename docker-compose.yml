services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    image: eduflow-course-admin-server-nest
    build:
      context: ./server-nest
      dockerfile: Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./server-nest/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SERVE_STATIC=false
      - DATA_ROOT=/app/data
      # 后端容器访问宿主机 MySQL 时，需要使用 Docker Desktop 提供的 host.docker.internal。
      - MYSQL_HOST=host.docker.internal
      - TYPEORM_MIGRATIONS_RUN=${TYPEORM_MIGRATIONS_RUN:-true}
    volumes:
      - ./server-nest/data:/app/data
