services:
  server-nest:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SERVE_STATIC=false
      - DATA_ROOT=/app/data
      # 容器访问宿主机 MySQL 8.0 时，Windows/Mac Docker Desktop 通常使用 host.docker.internal。
      - MYSQL_HOST=${MYSQL_HOST:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-eduflow_course_admin}
      - MYSQL_CONNECTION_LIMIT=${MYSQL_CONNECTION_LIMIT:-10}
    ports:
      - "3000:3000"
    volumes:
      # 仅持久化上传文件；业务数据已迁移到本机 MySQL。
      - ./data:/app/data
